# dsh-subagent-guard bundle patch
#
# 注册行：`id` 是身份键（Loader 用它折叠与覆盖，别改），`name` 必须是 npm 包名
# （它同时是被 import 的模块说明符）。
- insert:
    - id: dsh-subagent-guard
      name: dsh-subagent-guard
      config:
        enabled: true
        # 子代理沙箱硬顶：inherit | read-only | workspace-write | danger-full-access
        # 父会话的档位是子代理的原始上限；这里再补一层硬顶，只降不升。
        subagentSandboxCap: workspace-write
        # all = 父会话与子代理都拦
        # subagent = 只拦子代理（父会话保留完整执行能力，只锁子代理）
        denyScope: subagent
        # 携带命令文本的参数名。闸二按**参数形状**识别命令类工具：任何工具的
        # 参数里有这个字段就会被检查，与它叫什么名字无关（第三方 shell 自动覆盖）。
        commandArg: command
        # 额外纳入的工具名（不是全集，只补参数名不叫 command 的特殊 shell）。
        shellTools:
          - bash
          - pwsh
          - win_bash
        # 对 `pwsh -File x.ps1` 这类间接执行，读取脚本内容再匹配一遍同一套规则。
        scriptInspection: true
        # denyPatterns 不写就用内置默认值（卷影副本/还原点/分区表/引导/关机重启）。
        # 自定义时是**整体替换**，别只写新增的那条。
        #
        # ---- 闸三：委派策略（工具面 + prompt）----
        # 关掉后闸一、闸二照常工作，只是不注册 delegate 工具。
        enableDelegateTool: true
        # 委派工具名。
        toolName: delegate
        # 子代理 backend 的**注册名**（不是包名）：spawn | fork
        provider: spawn
        # 部署级工具上限。开启后，子代理最终工具面 = 模型传的 tools ∩ maxTools，
        # 模型永远不能自己放宽。
        #
        # 取向（2026-10-29 部署决策）：这里放"除记忆写入类之外的全部工具"作天花板，
        # 具体每次派发时再由父模型按任务性质挑（`delegate(tools: [...])` 只能更窄）。
        # 记忆写入类（deep_item / memory_forget / memory_backfill / branch_edit /
        # rule_add / habit_propose / habit_resolve）不在表里 —— 而且子代理本来就
        # 拿不到它们（dsh-ling 不往子代理会话注入工具）。列在这里是为了把意图写死：
        # 将来 l-ling 若开始注入，也仍然会被上限挡住。
        enforceMaxTools: true
        maxTools:
          - ask_user_question
          - calc
          - canvas_state
          - create_goal
          - edit
          - edit_image
          - ego_auth_flush
          - ego_captcha
          - ego_cdp
          - ego_check
          - ego_cli
          - ego_click
          - ego_dialog
          - ego_doctor
          - ego_download
          - ego_drag
          - ego_fill
          - ego_help
          - ego_hover
          - ego_http
          - ego_js
          - ego_key
          - ego_login_import
          - ego_navigate
          - ego_page_info
          - ego_read_element
          - ego_screenshot
          - ego_script
          - ego_scroll
          - ego_select
          - ego_snapshot
          - ego_space_close
          - ego_space_open
          - ego_status
          - ego_upload
          - ego_wait
          - ego_wait_for_response
          - ego_wait_for_selector
          - ego_wait_for_url
          - exit_plan_mode
          - find_inspiration
          - fold_recall
          - generate_image
          - generate_images
          - get_goal
          - glob
          - grep
          - interrupt_agent
          - job_kill
          - job_list
          - job_output
          - library_search
          - list_agents
          - list_folds
          - present
          - pwsh
          - read
          - read_image
          - read_page
          - recall
          - schedule_create
          - schedule_delete
          - schedule_list
          - schedule_update
          - send_message
          - skill
          - task_board_create
          - task_board_get
          - task_board_github_close_issue
          - task_board_github_comment
          - task_board_github_create_pr
          - task_board_github_get
          - task_board_github_link_pr
          - task_board_github_list
          - task_board_github_refresh
          - task_board_github_repositories
          - task_board_github_setup
          - task_board_list
          - task_board_manage
          - task_board_schedule
          - task_board_set_parent
          - task_board_update
          - todo_write
          - tree_read
          - update_goal
          - view_canvas
          - web_fetch
          - web_search
          - workflow
          - working_directory
          - write
          - x_search
        # 刻意不在上限里、且执行期被 guard 拒掉的：`subagent` / `subagent_fork` /
        # `delegate`（派生通道：留着等于给自己发钥匙）、`plugin_manager`
        # （能装卸插件 = 改写宿主，与"限制子代理"直接冲突，2026-10-29 主动排除）。
        # `list_subagent_models` 是 scoped 注册，`restrict()` 管不到，代码里放行
        # （见 lib/index.js 的 SAFE_SCOPED_TOOLS）。
        # `task_begin` / `task_end` 曾经也在豁免集里，2026-10-29 真机实测推翻：
        # 子代理**没有注册**这两个工具（调用返回 unknown tool），豁免它们的唯一
        # 效果是让拒绝消息把幽灵工具说成"可用"。已移除。
        # `recall` / `tree_read` / `library_search`（读记忆与图书馆）已补进上限：
        # 子代理该能查资料，但不该写记忆 —— 写入类工具仍在下面刻意排除之外。
        # persona 段落在 system prompt 里的位置与名字（同名会遮蔽全局同名段落）。
        sectionOrder: 120
        sectionName: "subagent-guard:persona"
        # 把「登记策略 → 创建子代理 → 核对认领」串行化。官方允许 50 个并发子代理，
        # 策略按父会话 FIFO 认领；不串行可能把 A 的策略绑到 B 的子代理上。
        serializeBind: true
